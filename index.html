<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>推荐APP</title>
  <style>
{ margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --border: #e5e7eb;
      --tip-bg: #e8f4ff;
      --tip-color: #1a73e8;
      --title-gradient: linear-gradient(90deg, #1a73e8, #7b2cbf);
      --btn-bg: linear-gradient(90deg, #1a73e8, #4285f4);
      --btn-text: #ffffff;
    }

    body.dark {
      --bg: #0c0c0f;
      --card-bg: #16161d;
      --text: #e5e5e5;
      --text-secondary: #999;
      --border: #2a2a35;
      --tip-bg: linear-gradient(90deg, #1a1a2e, #16213e);
      --tip-color: #00f5d4;
      --title-gradient: linear-gradient(90deg, #00f5d4, #7b2cbf);
      --btn-bg: linear-gradient(90deg, #00f5d4, #00bbf9);
      --btn-text: #0c0c0f;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .tip-bar {
      background: var(--tip-bg);
      color: var(--tip-color);
      text-align: center;
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .theme-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.06);
      border: none;
      color: var(--tip-color);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.dark .theme-btn {
      background: rgba(255,255,255,0.15);
    }

    .header {
      text-align: center;
      padding: 28px 20px 18px;
    }
    .header h2 {
      font-size: 20px;
      font-weight: 700;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .list {
      padding: 0 16px 20px;
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .card:active {
      transform: scale(0.98);
    }

    .icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      color: #fff;
      font-weight: bold;
    }

    .icon1 { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
    .icon2 { background: linear-gradient(135deg, #a55eea, #8854d0); }
    .icon3 { background: linear-gradient(135deg, #26de81, #20bf6b); }
    .icon4 { background: linear-gradient(135deg, #fd9644, #fa8231); }
    .icon5 { background: linear-gradient(135deg, #45aaf2, #2d98da); }
    .icon6 { background: linear-gradient(135deg, #fc5c65, #eb3b5a); }

    .card .info {
      flex: 1;
      padding-left: 14px;
    }

    .card .name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .card .btn {
      display: inline-block;
      padding: 7px 18px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      text-decoration: none;
    }

    .android-box {
      margin: 10px 16px 30px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid var(--border);
    }
    .android-box .title {
      display: flex;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--tip-color);
    }
    .android-box .title span {
      margin-right: 8px;
      font-size: 18px;
    }
    .android-box p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <script>
    function toggleTheme() {
      const body = document.body;
      const btn = document.getElementById('themeBtn');
      
      if (body.classList.contains('dark')) {
        body.classList.remove('dark');
        btn.textContent = '☀️';
        localStorage.setItem('theme', 'light');
      } else {
        body.classList.add('dark');
        btn.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
      }
    }

    // 记住用户选择，默认白天
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent = '🌙';
    }
  </script>
